<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lotru Brand</title>
    <meta name="description" content="Logos, color, typography and voice for Lotru." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://lotru.com/brand" />
    <link rel="alternate" type="text/markdown" title="Lotru brand spec" href="/brand/brand.md" />
    <link rel="alternate" type="application/json" title="Lotru brand data" href="/brand/brand.json" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0908" />
    <script>
      // Before first paint, so a saved theme never flashes the wrong one.
      try {
        var saved = localStorage.getItem('lotru-brand-theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
    <!--brand-tokens-->
    <link rel="stylesheet" href="./brand.css" />
    <script type="module" src="./brand.js"></script>
  </head>
  <body>
    <!--brand-body-->
  </body>
</html>
